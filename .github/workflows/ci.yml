name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "re/**", "docs/**"]
  pull_request:
    branches: [main, develop]

jobs:
  lfs-and-size-guard:
    name: File Size (>90MB) & Git LFS Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (without downloading LFS blobs to save quota)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Check for non-LFS binary files or files exceeding 90 MB
        shell: bash
        run: |
          echo "Checking tracked files in git index..."
          MAX_BYTES=$((90 * 1024 * 1024))
          FAILED=0
          while IFS= read -r -d '' file; do
            if [ -f "$file" ]; then
              size=$(stat -c%s "$file")
              if [ "$size" -gt "$MAX_BYTES" ]; then
                echo "::error file=$file::File exceeds 90 MB safety threshold ($size bytes)."
                FAILED=1
              fi
            fi
          done < <(git ls-files -z)
          exit $FAILED

  build-and-test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    needs: lfs-and-size-guard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Check if package.json exists (Phase 4+)
        id: check_pkg
        run: |
          if [ -f "package.json" ]; then
            echo "has_pkg=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pkg=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.check_pkg.outputs.has_pkg == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js LTS
        if: steps.check_pkg.outputs.has_pkg == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        if: steps.check_pkg.outputs.has_pkg == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint & Typecheck
        if: steps.check_pkg.outputs.has_pkg == 'true'
        run: pnpm run -r --if-present typecheck && pnpm run -r --if-present lint

      - name: Build Packages
        if: steps.check_pkg.outputs.has_pkg == 'true'
        run: pnpm build

      - name: Run Unit & Determinism Tests
        if: steps.check_pkg.outputs.has_pkg == 'true'
        run: pnpm test
